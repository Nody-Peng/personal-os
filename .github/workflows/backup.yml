# Daily backup of the database (every table Payload keeps in the public schema):
# pg_dump → encrypted with a passphrase → kept as a workflow artifact for 30 days.
# This repository is public and anyone signed in to GitHub can download its
# artifacts, so the dump is never stored unencrypted. Restoring: README → 備份.
#
# Repository → Settings → Secrets and variables → Actions:
#   BACKUP_DATABASE_URL  Supabase → Connect → Session pooler connection string
#                        (port 5432; the direct connection is IPv6-only and
#                        GitHub's runners can't reach it)
#   BACKUP_PASSPHRASE    a long random passphrase; keep it in your password manager,
#                        without it the backups can't be opened
name: Backup database

on:
  schedule:
    - cron: '30 19 * * *' # 03:30 in Taiwan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Add BACKUP_DATABASE_URL and BACKUP_PASSPHRASE under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ "${#PASSPHRASE}" -lt 20 ]; then
            echo "::error::BACKUP_PASSPHRASE is too short (use at least 20 characters)."
            exit 1
          fi

      - name: Dump the database
        # pg_dump 17 reads Postgres 15 and 17 alike (Supabase runs one of them).
        run: |
          docker run --rm -e DB_URL postgres:17-alpine \
            sh -c 'pg_dump "$DB_URL" --format=custom --schema=public --no-owner --no-privileges' > personal-os.dump
          test -s personal-os.dump
          echo "Dump: $(du -h personal-os.dump | cut -f1)"

      - name: Encrypt
        run: |
          name="personal-os-$(TZ=Asia/Taipei date +%Y%m%d-%H%M).dump.gpg"
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$name" personal-os.dump
          shred -u personal-os.dump
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"

      - name: Keep for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
